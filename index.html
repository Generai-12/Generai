.gcov .gico{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:31px;flex:none}
.gcov h2{margin:0;font-size:20px;line-height:1.2}.gcov .sub{font-size:12px;opacity:.9;margin-top:3px}
.gbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:10px 12px;margin:10px 0;box-shadow:0 4px 16px rgba(124,58,237,.08)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pl);color:var(--pu);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.stk{display:flex}.stk .ava{margin-left:-10px;border:2px solid #fff}.stk .ava:first-child{margin-left:0}
.ava{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.comp{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:12px;margin:10px 0;box-shadow:0 4px 16px rgba(124,58,237,.08)}
.comp .top{display:flex;gap:10px;align-items:flex-start}
.comp textarea{border:0;background:#f5f2ff;border-radius:18px;padding:11px 14px;min-height:46px;resize:none;margin:0;font-size:13px}
.comp textarea:focus{outline:2px solid #c4b5fd;background:#fff}
.comp .bt{display:flex;justify-content:flex-end;margin-top:8px}
.pc{background:#fff;border:1px solid var(--bd);border-radius:20px;margin:12px 0;box-shadow:0 4px 18px rgba(124,58,237,.08);overflow:hidden;transition:box-shadow .25s}
.pc:hover{box-shadow:0 10px 28px rgba(124,58,237,.16)}
.pc .ph2{display:flex;gap:10px;align-items:center;padding:12px 14px 4px}
.pc .meta{flex:1;min-width:0}.pc .nmr{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;line-height:1.3}.pc .tm{font-size:11px;color:var(--mu);margin-top:2px}
.pc .more{border:0;background:none;font-size:18px;color:var(--mu);cursor:pointer;border-radius:50%;width:34px;height:34px}.pc .more:hover{background:var(--pl)}
.pc .bd2{padding:6px 16px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.pc .cnt2{display:flex;justify-content:space-between;padding:0 16px 8px;font-size:12px;color:var(--mu)}
.pc .act{display:flex;border-top:1px solid var(--bd);padding:4px 6px;gap:4px}
.pc .act button{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer;transition:.2s}
.pc .act button:hover{background:var(--pl);color:var(--pu)}.pc .act button.on{color:var(--pu)}
.pc .act button.on .lk{display:inline-block;animation:popl .35s ease}
@keyframes popl{0%{transform:scale(1)}50%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}
.pc .cms{background:#faf8ff;border-top:1px solid var(--bd);padding:10px 14px}
.cm1{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.cmb{line-height:1.7!important;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:7px 12px;font-size:13px;line-height:1.4;max-width:100%}.cmb b{display:block;font-size:12px}
.cin{display:flex;gap:8px;align-items:center;margin-top:8px}.cin input{border-radius:999px;margin:0;background:#fff}
.sendb{border:0;background:var(--pu);color:#fff;border-radius:50%;width:38px;height:38px;flex:none;cursor:pointer;font-size:14px}
.pmn{display:flex;gap:8px;padding:6px 14px 10px;flex-wrap:wrap}
.abt{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px 14px}

.comp .bt{display:flex;gap:10px;align-items:center;margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.th{position:relative;width:78px;height:78px;border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.th img{width:100%;height:100%;object-fit:cover;margin:0}.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;padding:0}
.imgs{display:grid;gap:3px;margin:0 0 8px;background:#000}.imgs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;background:#eee}
.imgs.n1 img{max-height:460px;object-fit:contain;background:#111}.imgs.n2{grid-template-columns:1fr 1fr}.imgs.n2 img{aspect-ratio:1}
.imgs.n3{grid-template-columns:1fr 1fr}.imgs.n3 img{aspect-ratio:1}.imgs.n3 img:first-child{grid-column:1/3;aspect-ratio:2/1}
.imgs.n4{grid-template-columns:1fr 1fr}.imgs.n4 img{aspect-ratio:1}
.pc .act{position:relative}
.tray{position:absolute;left:8px;bottom:calc(100% + 4px);display:flex;gap:2px;background:#fff;border:1px solid var(--bd);border-radius:999px;padding:5px 8px;box-shadow:0 10px 28px rgba(124,58,237,.3);z-index:5;animation:trin .18s ease}
.pc .act .tray button{flex:none;font-size:24px;padding:2px 5px;border-radius:50%;transition:transform .15s}.pc .act .tray button:hover{transform:scale(1.35) translateY(-5px);background:none}
@keyframes trin{from{opacity:0;transform:translateY(8px) scale(.9)}}
.rsum{display:inline-flex;align-items:center}.rsum span{background:#fff;border:1.5px solid #fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px;margin-right:-5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}.rsum b{margin-left:9px;font-weight:600}
#lb{position:fixed;inset:0;background:rgba(10,5,25,.92);z-index:60;display:grid;place-items:center;padding:14px}#lb img{max-width:100%;max-height:90vh;border-radius:12px}

const vPut=async(id,b)=>{const d=await vdb();return new Promise((res,rej)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(b,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const vGet=async id=>{const d=await vdb();return new Promise((res,rej)=>{const q=d.transaction('v').objectStore('v').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};

  const src=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)});return src?{id:'v'+Date.now(),src,name:f.name}:null}

  from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

/* ===== ตั้งค่า (แก้ตรงนี้ได้) ===== */
const OWNER_EMAILS = ["rngcard85@gmail.com"]; // อีเมล Google ที่เป็นเจ้าของระบบ (เมนู Admin / อนุมัติกลุ่ม)

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = initializeFirestore(app, { ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true });
const $ = id => document.getElementById(id);
let cur = null;

/* ===== ตัวแปลง: ให้ Firestore ทำงานเหมือน API เดิมที่แอปเรียกใช้ ===== */
const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
const snapQ = s => ({ docs: s.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })) });
const onErr = e => console.error("Firestore:", e.code || "", e.message || e);
const dbAdapter = {
  collection: n => ({
    onSnapshot: (cb, eb) => onSnapshot(collection(fs, n), s => cb(snapQ(s)), e => { onErr(e); if (eb) eb(e); }),
    where: (f, o, v) => {
      const mk = ws => ({
        where: (f2, o2, v2) => mk([...ws, [f2, o2, v2]]),
        onSnapshot: (cb, eb) => onSnapshot(query(collection(fs, n), ...ws.map(w => where(w[0], w[1], w[2]))), s => cb(snapQ(s)), e => { onErr(e); if (eb) eb(e); }),
        get: async () => snapQ(await getDocs(query(collection(fs, n), ...ws.map(w => where(w[0], w[1], w[2])))))
      });
      return mk([[f, o, v]]);
    },
    doc: id => {
      const r = doc(fs, n, id);
      return {
        set: d => setDoc(r, d),
        merge: d => setDoc(r, d, { merge: true }),
        collection: sub => ({
          onSnapshot: cb => onSnapshot(collection(fs, n, id, sub), s => cb(snapQ(s)), onErr),
          get: async () => snapQ(await getDocs(collection(fs, n, id, sub))),
          doc: mid => { const rr = doc(fs, n, id, sub, mid); return { set: d => setDoc(rr, d), delete: () => deleteDoc(rr) }; }
        }),
        update: d => updateDoc(r, d),
        delete: () => deleteDoc(r),
        get: async () => snapDoc(await getDoc(r)),
        onSnapshot: cb => onSnapshot(r, s => cb(snapDoc(s)), onErr)
      };
    }
  })
};
const userAdapter = {
  me: async () => ({ name: (cur && cur.displayName) || "" }),
  id: async () => cur.uid,
  isOwner: async () => !!cur && OWNER_EMAILS.includes((cur.email || "").toLowerCase())
};

window.claude = { use: async n => {

}};

$("gwgo").onclick = async () => {

  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(e.code)) {
      try { await signInWithRedirect(auth, p); return; } catch (e2) { e = e2; }

          document.body.appendChild(b);
        }
        return;
      }
      location.reload(); return;
    }
    $("gwmsg").textContent = "เข้าสู่ระบบเพื่อเริ่มใช้งาน";
    $("gwgo").hidden = false;

<script id="gw-rep-js">
/* ===== ระบบรายงานผู้ใช้ + กันแชทหาย (เพิ่มใหม่) ===== */
const GW_REP_LIMIT=15;
const GW_REP_WHY=['โกง / หลอกลวง','คุกคาม / ด่าทอ','เนื้อหาไม่เหมาะสม','สแปม / โฆษณา','อื่นๆ'];
let gwReps=[],gwRepOn=false,gwRepSel=-1;
function gwRepIsDemo(u){return u=='demoowner'||/^dm\d$/.test(u)}
function gwRep(u,name,kind,ref){
 if(!u||u==uid)return;
 pmenu=null;
 if(gwRepIsDemo(u)){gwToast('ℹ️','บัญชีตัวอย่าง','นี่คือบัญชีตัวอย่างของระบบ รายงานไม่ได้');return}
 if(!db){alert('ต้องออนไลน์ก่อนจึงจะรายงานได้');return}
 gwRepSel=-1;
 const o=document.getElementById('gwrep');o&&o.remove();
 const d=document.createElement('div');d.id='gwrep';
 d.style.cssText='position:fixed;inset:0;background:rgba(10,5,25,.6);z-index:75;display:grid;place-items:center;padding:16px';
 d.dataset.u=u;d.dataset.n=name||'สมาชิก';d.dataset.k=kind||'';d.dataset.r=ref||'';
 d.innerHTML='<div style="background:#fff;color:#1f1633;border-radius:18px;padding:20px;max-width:360px;width:100%;max-height:90vh;overflow:auto">'
  +'<h3 style="margin:0 0 6px">🚩 รายงานผู้ใช้</h3>'
  +'<p style="margin:0 0 10px">'+esc(name||'สมาชิก')+'</p>'
  +GW_REP_WHY.map(function(w,i){return '<button class="btn gwrw" style="display:block;width:100%;text-align:left;margin:5px 0;border-radius:12px" onclick="gwRepPick('+i+')">'+esc(w)+'</button>'}).join('')
  +'<textarea rows="3" maxlength="200" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)" style="margin-top:8px"></textarea>'
  +'<div class="gwre" style="color:#b91c1c;font-size:12px;min-height:16px"></div>'
  +'<div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn" onclick="document.getElementById(\'gwrep\').remove()">ยกเลิก</button><button class="btn p gwrs" onclick="gwRepSend()">ส่งรายงาน</button></div></div>';
 document.body.appendChild(d)}
function gwRepPick(i){
 gwRepSel=i;
 document.querySelectorAll('#gwrep .gwrw').forEach(function(b,k){b.classList.toggle('p',k==i)});
 const e=document.querySelector('#gwrep .gwre');e&&(e.textContent='')}
async function gwRepSend(){
 const d=document.getElementById('gwrep');if(!d)return;
 const er=d.querySelector('.gwre');
 if(gwRepSel<0){er&&(er.textContent='กรุณาเลือกเหตุผล');return}
 const u=d.dataset.u,id=u+'_'+uid,note=(d.querySelector('textarea').value||'').trim().slice(0,200);
 let snip='';
 if(d.dataset.k=='post'){const p=posts.find(function(x){return x.id==d.dataset.r});snip=p&&p.text?String(p.text).slice(0,80):''}
 const btn=d.querySelector('.gwrs');btn&&(btn.disabled=true);
 try{
  await db.collection('reports').doc(id).set({u:u,uname:d.dataset.n,by:uid,byName:me.name||'สมาชิก',why:GW_REP_WHY[gwRepSel],note:note,kind:d.dataset.k,ref:d.dataset.r,snip:snip,at:Date.now(),status:'open'});
  d.remove();gwToast('🚩','ส่งรายงานแล้ว','ขอบคุณครับ ทีมงานจะตรวจสอบ');
 }catch(e){btn&&(btn.disabled=false);er&&(er.textContent='ส่งไม่สำเร็จ ลองใหม่อีกครั้ง')}}
function gwRepGroups(){
 const m={};
 gwReps.filter(function(r){return r.status!='closed'}).forEach(function(r){const g=m[r.u]||(m[r.u]={u:r.u,name:r.uname||'สมาชิก',list:[]});g.list.push(r);if(r.uname)g.name=r.uname});
 return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.list.length-a.list.length})}
function gwRepWatch(){
 let seen={};try{seen=JSON.parse(localStorage.getItem('gw_rep15')||'{}')}catch(e){}
 gwRepGroups().forEach(function(g){
  if(g.list.length<GW_REP_LIMIT)return;
  const k=g.u+'|'+Math.min.apply(null,g.list.map(function(r){return r.at||0}));
  if(seen[k])return;seen[k]=1;
  try{localStorage.setItem('gw_rep15',JSON.stringify(seen))}catch(e){}
  try{beep()}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  gwToast('🚨','ผู้ใช้ถูกรายงานครบ '+GW_REP_LIMIT+' ครั้ง',g.name+' · แตะเพื่อดูรายละเอียด',function(){tab='admin';render()})})}
setInterval(function(){
 if(gwRepOn||!db||!isAdmin||window.gwAdm!==true)return;
 gwRepOn=true;
 db.collection('reports').onSnapshot(function(s){
  gwReps=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
  try{gwRepWatch()}catch(e){}
  if(tab=='admin')render()})},2000);
function gwRepAdm(){
 const G=gwRepGroups();
 const rows=G.map(function(g){
  const n=g.list.length,hot=n>=GW_REP_LIMIT,t={};
  g.list.forEach(function(r){t[r.why]=(t[r.why]||0)+1});
  const why=Object.keys(t).map(function(k){return esc(k)+' ×'+t[k]}).join(' · ');
  const notes=g.list.filter(function(r){return r.note||r.snip}).sort(function(a,b){return (b.at||0)-(a.at||0)}).slice(0,3)
   .map(function(r){return '<div class="mu">• '+esc(r.byName||'สมาชิก')+': '+esc(r.note||('โพสต์: '+r.snip))+'</div>'}).join('');
  return '<div class="card" style="'+(hot?'border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.25)':'')+'">'
   +'<div class="row"><b style="flex:1">'+esc(g.name)+'</b><span class="tag" style="'+(hot?'background:#fee2e2;color:#b91c1c':'')+'">'+n+' / '+GW_REP_LIMIT+'</span></div>'
   +(hot?'<div style="color:#b91c1c;font-weight:700;margin:4px 0">⚠️ ถูกรายงานครบ '+GW_REP_LIMIT+' ครั้ง ควรตรวจสอบ</div>':'')
   +'<div class="mu" style="margin:4px 0">'+why+'</div>'+notes
   +'<div class="row" style="margin-top:8px"><button class="btn" data-u="'+esc(g.u)+'" onclick="openProf(this.dataset.u)">👁 ดูโปรไฟล์</button>'
   +'<button class="btn" data-u="'+esc(g.u)+'" onclick="gwRepClose(this.dataset.u)">✔ ปิดเรื่อง</button></div></div>'}).join('');
 return '<h3>🚩 รายงานผู้ใช้ ('+G.length+')</h3><div class="mu" style="margin-bottom:6px">ระบบไม่แบนอัตโนมัติ · แจ้งเตือนแอดมินเมื่อถูกรายงานครบ '+GW_REP_LIMIT+' ครั้ง แล้วให้แอดมินตัดสินเอง</div>'
  +(rows||'<div class="mu">ยังไม่มีรายงาน</div>')}
async function gwRepClose(u){
 if(!confirm('ปิดเรื่องรายงานของผู้ใช้นี้?'))return;
 const L=gwReps.filter(function(r){return r.u==u&&r.status!='closed'});
 try{await Promise.all(L.map(function(r){return db.collection('reports').doc(r.id).update({status:'closed',closedAt:Date.now()})}))}catch(e){alert('ปิดเรื่องไม่สำเร็จ ลองใหม่อีกครั้ง')}}
const _gwA7=admin;
admin=function(){const h=_gwA7.apply(this,arguments);return h+(window.gwAdm===true?gwRepAdm():'')};

/* ----- แชทไม่หาย: รวมข้อความล่าสุดจากเซิร์ฟเวอร์ก่อนบันทึกทุกครั้ง ----- */
const _gwSC=saveChat;
saveChat=async function(){
 const A=arguments,V=viewId,P=peer;
 try{
  if(db&&(V||(P&&P.u))){
   const id=V||cid(uid,P.u),sn=await db.collection('chats').doc(id).get(),f=sn&&sn.exists?sn.data():null;
   if(f){
    let c=chats.find(function(y){return y.id==id});
    if(!c){c=Object.assign({id:id},f);chats.push(c)}
    else{
     const key=function(z){return [z.at,z.from||'',z.t||'',z.st||'',z.sys||''].join('|')},
      have=new Set((c.msgs||[]).map(key)),
      extra=(f.msgs||[]).filter(function(z){return !have.has(key(z))});
     if(extra.length)c.msgs=(c.msgs||[]).concat(extra).sort(function(a,b){return (a.at||0)-(b.at||0)});
     ['ps','nm','mediator','needMid','step','inv'].forEach(function(k){if(k in f)c[k]=f[k]})}}}

<script>
(function(){var raf=0,LIM=4;
function run(){raf=0;var h=window.innerHeight,n=0;
 document.querySelectorAll('.ava[class*="sk-"],.av[class*="sk-"]').forEach(function(e){
  var r=e.getBoundingClientRect(),vis=r.width>0&&r.bottom>0&&r.top<h;
  if(vis&&n<LIM){n++;e.classList.remove('skoff')}else e.classList.add('skoff')})}
function go(){if(!raf)raf=requestAnimationFrame(run)}
window.addEventListener('scroll',go,{passive:true,capture:true});window.addEventListener('resize',go);
if(typeof window.render==='function'){var _r=window.render;window.render=function(){var x=_r.apply(this,arguments);go();return x}}
setInterval(go,2500);go()})();
</script>
<script>
/* ===== GENERIA: ป้องกันการกดซ้ำ/ตรวจสถานะก่อนทำรายการ (ส่วนเสริมเฉพาะจุด) ===== */
(function(){
 'use strict';
 var locks=Object.create(null);
 function once(key,fn){if(locks[key])return Promise.resolve(false);locks[key]=1;return Promise.resolve().then(fn).finally(function(){delete locks[key]})}
 function alertBusy(){try{alert('กำลังดำเนินการอยู่ กรุณารอสักครู่')}catch(e){}}
 function freshProfile(){if(typeof db==='undefined'||!db||typeof uid==='undefined'||!uid)return Promise.resolve(typeof me==='undefined'?{}:me);return db.collection('profiles').doc(uid).get().then(function(s){return s&&s.exists?(s.data()||{}):(typeof me==='undefined'?{}:me)})}
 function freshGroup(id){if(!window.db)return Promise.resolve((window.groups||[]).find(function(g){return g.id===id})||null);return window.db.collection('groups').doc(id).get().then(function(s){return s&&s.exists?Object.assign({id:id},s.data()):null})}

 /* 1) รับงานกลาง: ตรวจสถานะล่าสุดก่อนรับ และกันกดซ้ำบนเครื่องเดียวกัน */
 if(typeof window.midAccept==='function'){
  var oldMidAccept=window.midAccept;
  window.midAccept=function(id){return once('mid:'+id,async function(){
   var m=(typeof mids==='undefined'?[]:mids).find(function(x){return x.id===id});
   if(typeof db!=='undefined'&&db){var s=await db.collection('mids').doc(id).get();m=s&&s.exists?Object.assign({id:id},s.data()):null;}
   if(!m||m.status!=='waiting'){alert('คำขอนี้ถูกรับไปแล้วหรือถูกยกเลิก');return false;}
   return oldMidAccept(id);
  }).catch(function(e){alert('รับงานไม่สำเร็จ กรุณาลองใหม่');return false})}
 }

 /* 2) เช็คอิน: กันการกดซ้ำ และตรวจวันล่าสุดจากข้อมูลที่บันทึก */
 if(typeof window.checkin==='function'){
  var oldCheckin=window.checkin;
  window.checkin=function(){return once('checkin:'+(typeof uid==='undefined'?'':uid),async function(){
   var p=await freshProfile();
   var today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
   if(p.last===today){me=Object.assign({},me,p);alert('วันนี้เช็คอินแล้ว');return false;}
   me=Object.assign({},me,p);
   return oldCheckin();
  }).catch(function(){alert('เช็คอินไม่สำเร็จ กรุณาลองใหม่');return false})}
 }

 /* 3) แลก Premium: กันกดซ้ำและตรวจแต้มล่าสุดก่อนตัด */
 if(typeof window.redeem==='function'){
  var oldRedeem=window.redeem;
  window.redeem=function(){return once('redeem:'+(typeof uid==='undefined'?'':uid),async function(){
   var p=await freshProfile();me=Object.assign({},me,p);
   if((Number(p.points)||0)<500){alert('แต้มไม่เพียงพอ');return false;}
   return oldRedeem();
  }).catch(function(){alert('แลก Premium ไม่สำเร็จ กรุณาลองใหม่');return false})}
 }

 /* 4) เข้ากลุ่ม: กันคำขอซ้ำ ตรวจสถานะ/สิทธิ์/จำนวนสมาชิกจากเอกสารล่าสุด */
 if(typeof window.join==='function'){
  var oldJoin=window.join;
  window.join=function(id){if(id==='demo')return oldJoin(id);return once('join:'+(typeof uid==='undefined'?'':uid)+':'+id,async function(){
   var g=await freshGroup(id);if(!g||g.status!=='approved'){alert('ไม่พบกลุ่มหรือกลุ่มยังไม่ได้รับอนุมัติ');return false;}
   var members=Array.isArray(g.members)?g.members:[];
   if(members.includes(uid)){alert('คุณเป็นสมาชิกกลุ่มนี้แล้ว');return false;}
   if(g.need>0&&members.length>=g.need){alert('กลุ่มนี้เต็มแล้ว');return false;}
   if(g.prem&&!(typeof isCreator==='function'&&isCreator())&&!(Number((typeof me==='undefined'?{}:me).premiumUntil)>Date.now())){alert('กลุ่มนี้สำหรับสมาชิก Premium เท่านั้น');return false;}
   return oldJoin(id);
  }).catch(function(){alert('เข้าร่วมกลุ่มไม่สำเร็จ กรุณาลองใหม่');return false})}
 }

 /* 5) ส่งข้อความ / 6) โพสต์: กันการส่งซ้ำจากการแตะปุ่มรัว */
 ['send','post'].forEach(function(name){if(typeof window[name]!=='function')return;var old=window[name];window[name]=function(){var id=name==='send'?((typeof viewId!=='undefined'&&viewId)||((typeof peer!=='undefined'&&peer&&peer.u)?[uid,peer.u].sort().join('_'):'')):((typeof openG!=='undefined'&&openG)||'');return once(name+':'+(typeof uid==='undefined'?'':uid)+':'+id,function(){return old.apply(this,arguments)}.bind(this)).catch(function(){alert('ทำรายการไม่สำเร็จ กรุณาลองใหม่');return false})}});
})();
/* ===== หมายเหตุ: การบังคับสิทธิ์จริง, ป้องกันการแก้ fee/แต้มจากภายนอก และการจำกัดการอ่านข้อมูล ต้องตั้ง Firestore Security Rules/Cloud Functions ฝั่งเซิร์ฟเวอร์ร่วมด้วย ===== */

</script>
<script id="gw-premium-request-system">
(function(){
 const oldPrem=prem, oldAdmin=admin;
 let premReqCache=[], premReqUnsub=null;
 function escP(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 window.premSlipData='';
 window.premSlipChanged=function(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2*1024*1024){alert('กรุณาเลือกรูป JPG, PNG หรือ WEBP ขนาดไม่เกิน 2 MB');inp.value='';return;}const rd=new FileReader();rd.onload=()=>{window.premSlipData=String(rd.result||'');const p=document.getElementById('premSlipPreview');if(p)p.innerHTML='<img src="'+window.premSlipData+'" style="max-width:100%;max-height:220px;border-radius:10px">';};rd.readAsDataURL(f)};
 window.premSubmitRequest=async function(){try{if(!db||!uid){alert('กรุณาเข้าสู่ระบบก่อนส่งคำขอ');return;}if(isPrem()){alert('บัญชีนี้เป็นสมาชิก Premium อยู่แล้ว');return;}if(!window.premSlipData){alert('กรุณาแนบรูปสลิปก่อนส่งคำขอ');return;}const id='pr_'+uid;const ref=db.collection('premiumRequests').doc(id);const old=await ref.get();if(old&&old.exists&&old.data().status==='pending'){alert('คุณมีคำขอที่กำลังรอตรวจสอบอยู่แล้ว');return;}await ref.set({uid:uid,userName:me.name||'สมาชิก',amount:99,planDays:30,slip:window.premSlipData,status:'pending',createdAt:Date.now(),updatedAt:Date.now()});alert('ส่งคำขอซื้อ Premium แล้ว กรุณารอแอดมินตรวจสอบยอดเงินจริง');window.premSlipData='';render();}catch(e){console.error(e);alert('ส่งคำขอไม่สำเร็จ กรุณาลองใหม่ หรือแจ้งแอดมิน');}};
 window.premApprove=async function(id){if(!isAdmin||window.gwAdm!==true)return;if(!confirm('ยืนยันว่าได้ตรวจสอบเงินเข้า TrueMoney จริง 99 บาทแล้วใช่ไหม?'))return;try{const r=db.collection('premiumRequests').doc(id),s=await r.get();if(!s||!s.exists||s.data().status!=='pending')throw Error('คำขอไม่อยู่ในสถานะรอตรวจสอบ');const x=s.data(),p=db.collection('profiles').doc(x.uid),ps=await p.get();if(!ps||!ps.exists)throw Error('ไม่พบโปรไฟล์ผู้ซื้อ');const d=ps.data()||{};await p.set({...d,premiumUntil:Math.max(Date.now(),Number(d.premiumUntil)||0)+30*864e5});await r.update({status:'approved',approvedAt:Date.now(),approvedBy:uid});alert('อนุมัติ Premium 30 วันแล้ว');render();}catch(e){console.error(e);alert('อนุมัติไม่สำเร็จ: '+(e.message||''));}};
 window.premReject=async function(id){if(!isAdmin||window.gwAdm!==true)return;if(!confirm('ยืนยันปฏิเสธคำขอนี้?'))return;try{await db.collection('premiumRequests').doc(id).update({status:'rejected',rejectedAt:Date.now(),rejectedBy:uid});alert('ปฏิเสธคำขอแล้ว');render();}catch(e){console.error(e);alert('ทำรายการไม่สำเร็จ');}};
 prem=function(){let h=oldPrem.apply(this,arguments);if(!isPrem()){let extra='<div class="card"><h3>📨 ส่งคำขอซื้อ Premium</h3><div class="mu">โอน 99 บาทแล้ว แนบสลิปเพื่อส่งให้แอดมินตรวจสอบยอดเงินจริง</div><label class="btn" style="display:block;text-align:center;margin:10px 0;cursor:pointer">เลือกรูปสลิป<input type="file" accept="image/png,image/jpeg,image/webp" onchange="premSlipChanged(this)" style="display:none"></label><div id="premSlipPreview" style="text-align:center"></div><button class="btn p" style="width:100%;margin-top:8px" onclick="premSubmitRequest()">ส่งคำขอซื้อ Premium</button><div class="mu" style="margin-top:8px">สถานะคำขอจะแสดงในหน้านี้หลังส่งแล้ว</div></div>';h=h.replace('<div class="card"><h3 style="margin-top:0">สิทธิพิเศษของสมาชิก</h3>',extra+'<div class="card"><h3 style="margin-top:0">สิทธิพิเศษของสมาชิก</h3>');}return h;};
 admin=function(){let h=oldAdmin.apply(this,arguments);if(window.gwAdm!==true)return h;let rows=premReqCache.filter(x=>x.status==='pending').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return h+'<h3>👑 คำขอซื้อ Premium ('+rows.length+')</h3><div class="mu">ตรวจสอบเงินเข้า TrueMoney จริง 99 บาทก่อนกดอนุมัติทุกครั้ง</div>'+(rows.map(x=>'<div class="card"><b>'+escP(x.userName)+'</b><div class="mu">UID: '+escP(x.uid)+' · '+new Date(x.createdAt||0).toLocaleString('th-TH')+'</div><div style="margin:10px 0"><img src="'+x.slip+'" alt="สลิปผู้ซื้อ" style="max-width:100%;max-height:300px;border-radius:10px"></div><div class="row"><button class="btn p" onclick="premApprove(\''+escP(x.id)+'\')">อนุมัติ 30 วัน</button><button class="btn" onclick="premReject(\''+escP(x.id)+'\')">ปฏิเสธ</button></div></div>').join('')||'<div class="mu" style="padding:8px 0">ไม่มีคำขอซื้อ Premium ที่รอตรวจสอบ</div>');};
 function watch(){if(!db||!isAdmin||window.gwAdm!==true||premReqUnsub)return;try{premReqUnsub=db.collection('premiumRequests').onSnapshot(s=>{premReqCache=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='admin')render();});}catch(e){console.warn('Premium request listener:',e)}}
 const oldRender=render;render=function(){watch();return oldRender.apply(this,arguments)};
})();

</script>
</body></html>
