.imgs{display:grid;gap:3px;margin:0 0 8px;background:#000}.imgs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;background:#eee}
.imgs.n1 img{max-height:460px;object-fit:contain;background:#111}.imgs.n2{grid-template-columns:1fr 1fr}.imgs.n2 img{aspect-ratio:1}
.imgs.n3{grid-template-columns:1fr 1fr}.imgs.n3 img{aspect-ratio:1}.imgs.n3 img:first-child{grid-column:1/3;aspect-ratio:2/1}
.imgs.n4{grid-template-columns:1fr 1fr}.imgs.n4 img{aspect-ratio:1}
.pc .act{position:relative}
.tray{position:absolute;left:8px;bottom:calc(100% + 4px);display:flex;gap:2px;background:#fff;border:1px solid var(--bd);border-radius:999px;padding:5px 8px;box-shadow:0 10px 28px rgba(124,58,237,.3);z-index:5;animation:trin .18s ease}
.pc .act .tray button{flex:none;font-size:24px;padding:2px 5px;border-radius:50%;transition:transform .15s}.pc .act .tray button:hover{transform:scale(1.35) translateY(-5px);background:none}
@keyframes trin{from{opacity:0;transform:translateY(8px) scale(.9)}}
.rsum{display:inline-flex;align-items:center}.rsum span{background:#fff;border:1.5px solid #fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px;margin-right:-5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}.rsum b{margin-left:9px;font-weight:600}
#lb{position:fixed;inset:0;background:rgba(10,5,25,.92);z-index:60;display:grid;place-items:center;padding:14px}#lb img{max-width:100%;max-height:90vh;border-radius:12px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { initializeFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where }
  from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

/* ===== ตั้งค่า (แก้ตรงนี้ได้) ===== */
const OWNER_EMAILS = ["rngcard85@gmail.com"]; // อีเมล Google ที่เป็นเจ้าของระบบ (เมนู Admin / อนุมัติกลุ่ม)
const firebaseConfig = {
  apiKey: "AIzaSyC3SE7pqaijotb7_xNElbkis9xG82qQsfQ",
  authDomain: "generai-edb31.firebaseapp.com",
  projectId: "generai-edb31",
  storageBucket: "generai-edb31.firebasestorage.app",
  messagingSenderId: "1012861067957",
  appId: "1:1012861067957:web:80411e2bdbafda2c20d4fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = initializeFirestore(app, { ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true });
const $ = id => document.getElementById(id);
let cur = null;

/* ===== ตัวแปลง: ให้ Firestore ทำงานเหมือน API เดิมที่แอปเรียกใช้ ===== */
const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
const snapQ = s => ({ docs: s.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })) });
const onErr = e => console.error("Firestore:", e.code || "", e.message || e);
const dbAdapter = {
  collection: n => ({
    onSnapshot: cb => onSnapshot(collection(fs, n), s => cb(snapQ(s)), onErr),
    where: (f, o, v) => ({ onSnapshot: cb => onSnapshot(query(collection(fs, n), where(f, o, v)), s => cb(snapQ(s)), onErr) }),
    doc: id => {
      const r = doc(fs, n, id);
      return {
        set: d => setDoc(r, d),
        update: d => updateDoc(r, d),
        delete: () => deleteDoc(r),
        get: async () => snapDoc(await getDoc(r)),
        onSnapshot: cb => onSnapshot(r, s => cb(snapDoc(s)), onErr)
      };
    }
  })
};
const userAdapter = {
  me: async () => ({ name: (cur && cur.displayName) || "" }),
  id: async () => cur.uid,
  isOwner: async () => !!cur && OWNER_EMAILS.includes((cur.email || "").toLowerCase())
};
/* ไม่มี 'assets' (ยังไม่เปิด Storage) แอปจะใช้วิธีสำรองเอง */
window.claude = { use: async n => {
  if (n === "db") return dbAdapter;
  if (n === "user") return userAdapter;
  throw new Error("unsupported: " + n);
}};

/* ===== ล็อกอิน / ออกจากระบบ ===== */
$("gwgo").onclick = async () => {
  $("gwerr").textContent = "";
  const p = new GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(e.code)) {
      try { await signInWithRedirect(auth, p); return; } catch (e2) { e = e2; }
    }
    if (["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) return;
    $("gwerr").textContent = e.code === "auth/unauthorized-domain"
      ? "โดเมนนี้ยังไม่ได้เพิ่มใน Firebase > Authentication > Settings > Authorized domains"
      : "ล็อกอินไม่สำเร็จ (" + (e.code || e.message) + ")";
  }
};
window.gwLogout = async () => { await signOut(auth); location.reload(); };

let booted = false;
onAuthStateChanged(auth, u => {
  cur = u;
  if (u) {
    $("gwlogin").style.display = "none";
    if (!booted) { booted = true; try { window.gwBoot && window.gwBoot(); } catch (e) { console.error(e); } }
  } else {
    if (booted) { location.reload(); return; }
    $("gwmsg").textContent = "เข้าสู่ระบบเพื่อเริ่มใช้งาน";
    $("gwgo").hidden = false;
  }
});

/* ปุ่มออกจากระบบในหน้าโปรไฟล์ */
const _p = window.profile;
if (typeof _p === "function") window.profile = function () {
  return _p() + '<div class="card"><button class="btn" onclick="gwLogout()">ออกจากระบบ</button></div>';
};
</script>

function gwRepGroups(){

 const L=chats.filter(function(c){return c.inv||c.mediator||c.needMid}).sort(function(a,b){return gwMedLast(b)-gwMedLast(a)});

  else st='ขอดึงกลาง';
  const body=ms.slice(-100).map(function(m){
   const name=m.sys?'ระบบ':(m.from?who(m.from):'—');
   const tx=m.sys?m.t:(m.st?m.st:(m.t||(m.img||(m.imgs&&m.imgs.length)?'🖼️ รูปภาพ':(m.vid?'🎬 วิดีโอ':''))));
   return '<div style="padding:5px 0;border-top:1px solid var(--bd)"><b style="font-size:11px">'+esc(name)+'</b> <span class="mu" style="font-size:10.5px">'+esc(T(m.at))+'</span><div style="word-break:break-word;white-space:pre-wrap">'+esc(tx)+'</div></div>'}).join('');
  return '<div class="card"><div class="row" style="flex-wrap:nowrap"><b style="flex:1;min-width:0">'+esc(nm.join(' ↔ ')||c.id)+'</b><button class="btn p" data-i="'+esc(c.id)+'" onclick="gwMedView(this.dataset.i)">เข้าแชท</button></div>'
   +'<div class="mu" style="margin:3px 0">'+esc(st)+'</div>'
   +'<details><summary class="mu" style="cursor:pointer">ดูข้อความทั้งหมด ('+ms.length+')</summary>'+(body||'<div class="mu">ยังไม่มีข้อความ</div>')+'</details></div>'}).join('');
 const M=(typeof mids!=='undefined'?mids:[]).slice().sort(function(a,b){return (b.at||0)-(a.at||0)});
 const mrows=M.map(function(m){
  return '<div class="card"><div class="row"><b style="flex:1">'+esc(m.byName||'สมาชิก')+' <span class="mu">('+(m.role=='seller'?'ผู้ขาย':'ผู้ซื้อ')+')</span></b><span class="tag">'+esc(SLm[m.status]||m.status||'')+'</span></div>'
   +'<div class="mu">'+esc(m.gname||'ไม่ระบุกลุ่ม')+' · '+esc(T(m.at))+(m.midName?' · กลาง: '+esc(m.midName):'')+'</div>'
   +(m.note?'<div style="margin-top:4px;word-break:break-word">'+esc(m.note)+'</div>':'')+'</div>'}).join('');
 return gwInvAdm()+'<h3>🛎️ แชทที่ขอดึงกลางทั้งหมด ('+L.length+')</h3><div class="mu" style="margin-bottom:6px">รวมแชทที่กดเชิญกลางและยังรอตอบรับ ดูข้อความได้เลยโดยไม่ต้องเข้าแชท</div>'
  +(rows||'<div class="mu">ไม่มี</div>')
  +'<h3>📋 คำขอเรียกกลางจากเมนู "เรียกกลาง" ทั้งหมด ('+M.length+')</h3>'+(mrows||'<div class="mu">ไม่มี</div>')}
/* ----- คำเชิญกลาง: เด้งเฉพาะหน้า Admin + ประวัติ + ปุ่มยอมรับ ----- */
function gwInvPending(){return chats.filter(function(c){return c.inv&&!c.mediator&&!(c.ps||[]).includes(uid)})}
function gwInvHist(){
 const out=[];
 chats.forEach(function(c){
  const nm=c.nm||[],ms=c.msgs||[],idx=[];
  ms.forEach(function(m,i){if(m.sys&&String(m.t||'').indexOf('เชิญตัวกลางเข้าแชท')>=0)idx.push(i)});
  idx.forEach(function(i,n){
   const m=ms[i],t=String(m.t),a=t.indexOf(' '),e=t.indexOf(' เชิญตัวกลาง');
   const by=(a>=0&&e>a)?t.slice(a+1,e):'สมาชิก';
   let acc=0;
   for(let k=i+1;k<ms.length;k++){const x=ms[k];if(x.sys&&String(x.t||'').indexOf('ตัวกลาง GENERIA เข้าร่วมแชทนี้แล้ว')>=0){acc=x.at||1;break}}
   const pend=!acc&&n==idx.length-1&&!!c.inv&&!c.mediator;
   out.push({cid:c.id,by:by,who:nm.join(' ↔ ')||c.id,at:m.at||0,acc:acc,pend:pend,mine:(c.ps||[]).includes(uid)})})});
 return out.sort(function(x,y){return y.at-x.at})}
function gwInvAdm(){
 const T=function(t){return t?new Date(t).toLocaleString('th-TH'):''};
 const H=gwInvHist(),P=H.filter(function(x){return x.pend}),O=H.filter(function(x){return !x.pend});
 const row=function(x){
  return '<div class="card" style="'+(x.pend?'border-color:#F5C76B;box-shadow:0 0 0 2px rgba(245,199,107,.25)':'')+'">'
   +'<div class="row" style="flex-wrap:nowrap"><b style="flex:1;min-width:0">'+esc(x.by)+' เชิญกลาง</b>'
   +(x.pend?'<span class="tag" style="background:#F5C76B;color:#1b1405">รอยอมรับ</span>':(x.acc?'<span class="tag">ยอมรับแล้ว</span>':'<span class="tag">ไม่มีการตอบรับ</span>'))+'</div>'
   +'<div class="mu" style="margin:3px 0">แชท: '+esc(x.who)+'</div>'
   +'<div class="mu">เชิญเมื่อ '+esc(T(x.at))+(x.acc&&x.acc>1?' · ยอมรับเมื่อ '+esc(T(x.acc)):'')+'</div>'
   +'<div class="row" style="margin-top:8px">'+(x.pend&&!x.mine?'<button class="btn p" data-i="'+esc(x.cid)+'" onclick="invAccept(this.dataset.i)">✔ ยอมรับ</button>':'')
   +'<button class="btn" data-i="'+esc(x.cid)+'" onclick="gwMedView(this.dataset.i)">ดูแชท</button></div></div>'};
 return '<h3>🛎️ คำเชิญกลาง'+(P.length?' <span class="tag" style="background:#ef4444;color:#fff">'+P.length+' รอยอมรับ</span>':'')+'</h3>'
  +'<div class="mu" style="margin-bottom:6px">เห็นเฉพาะแอดมิน · ใครเชิญกลางจะขึ้นที่นี่ กดยอมรับเพื่อเข้าแชทให้ทั้งสองฝ่ายคุยต่อได้</div>'
  +(P.map(row).join('')||'<div class="mu" style="margin-bottom:6px">ไม่มีคำเชิญที่รออยู่</div>')
  +'<h3>ประวัติคำเชิญกลาง ('+O.length+')</h3>'+(O.map(row).join('')||'<div class="mu">ยังไม่มีประวัติ</div>')}
const _gwIP=gwInvPop;
gwInvPop=function(){
 if(tab==='admin')return _gwIP.apply(this,arguments);
 const p=document.getElementById('invpop');p&&p.remove();
 if(isMid()){gwInvPending().forEach(function(c){const k=c.id+'_'+((c.inv&&c.inv.at)||0);
  if(!gwInvSeen[k]){gwInvSeen[k]=1;try{beep()}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}})}};
function gwInvBadge(){
 if(!isMid())return;const n=gwInvPending().length;if(!n)return;
 const b=Array.prototype.find.call(document.querySelectorAll('#nav button'),function(x){return (x.getAttribute('onclick')||'').indexOf("tab='admin'")>=0});
 if(b)b.insertAdjacentHTML('beforeend','<span style="background:#ef4444;color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:3px">'+n+'</span>')}
const _gwR10=render;
render=function(){const r=_gwR10.apply(this,arguments);try{gwInvBadge();gwInvPop()}catch(e){}return r};
const _gwA8=admin;
admin=function(){const h=_gwA8.apply(this,arguments);return h+(window.gwAdm===true?gwMedAdm():'')};
</script>
